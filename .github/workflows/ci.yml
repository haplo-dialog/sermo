name: haplo-dialog CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── gtk3sermo — port de référence (autotools) ────────────────────────────────
  gtk3sermo:
    name: gtk3sermo (GTK3 — référence)
    runs-on: ubuntu-latest
    container: debian:testing
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential flex bison pkg-config \
            libgtk-3-dev libglib2.0-dev \
            autoconf automake libtool

      - name: Configurer
        working-directory: gtk3sermo/gtk3sermo_1.0.0
        run: |
          autoreconf -fi
          ./configure --prefix=/usr/local \
            CFLAGS="-O2 -Wall -Wextra -Werror=format-security -D_FORTIFY_SOURCE=3 -fstack-protector-strong -fstack-clash-protection" \
            LDFLAGS="-Wl,-z,relro,-z,now"

      - name: Compiler
        working-directory: gtk3sermo/gtk3sermo_1.0.0
        run: make -j$(nproc)

      - name: Tests unitaires
        working-directory: gtk3sermo/gtk3sermo_1.0.0
        run: make check   # gtk3sermo est le port de référence vérifié : les tests doivent passer

      - name: cppcheck (analyse statique)
        working-directory: gtk3sermo/gtk3sermo_1.0.0
        run: |
          apt-get install -y --no-install-recommends cppcheck
          cppcheck --enable=warning,style --suppress=missingInclude \
            --std=c11 --error-exitcode=1 \
            -I src/ src/ 2>&1 | head -50
        continue-on-error: true

  # ── Tests XML de régression ───────────────────────────────────────────────
  xml-regression:
    name: Tests XML de régression
    runs-on: ubuntu-latest
    container: debian:testing
    needs: gtk3sermo
    steps:
      - uses: actions/checkout@v4

      - name: Installer gtk3sermo
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential flex bison pkg-config libgtk-3-dev libglib2.0-dev \
            autoconf automake libtool
          cd gtk3sermo/gtk3sermo_1.0.0
          autoreconf -fi && ./configure --prefix=/usr/local && make -j$(nproc) && make install

      - name: Lancer la suite XML
        run: |
          cd tests/xml
          ./run_tests.sh gtk3sermo

  # ── Vérification du formatage ─────────────────────────────────────────────
  format-check:
    name: Vérification clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer clang-format
        run: sudo apt-get install -y clang-format-15

      - name: Vérifier le format (gtk3sermo core)
        run: |
          find gtk3sermo/gtk3sermo_1.0.0/src -name "*.c" -o -name "*.h" | \
            xargs clang-format-15 --dry-run --Werror 2>&1 | head -30
        continue-on-error: true

