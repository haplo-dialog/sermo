# Intégration continue — miroirs GitHub / Gitea
#
# ⚠️ La CI de RÉFÉRENCE est `.gitlab-ci.yml`, à la racine : c'est elle qui tourne
# à chaque poussée sur gitlab.com/haplo-dialog/sermo, et c'est elle qui fait foi.
# Ce fichier n'en est qu'une transposition, fournie pour les miroirs et les
# duplications (forks) hébergés ailleurs. Il n'est exécuté par aucun automate du
# projet : personne ici ne l'a jamais vu tourner. Si les deux divergent, croire
# `.gitlab-ci.yml`.
#
# Il couvre le même terrain :
#   build   : compile CHAQUE port GTK (autotools), puis le valide contre la
#             suite XML (--print-ir : analyse seule, sans serveur X), les tests
#             de comportement, la mesure de durcissement sur le binaire produit,
#             le garde-fou du thread de la barre de progression, et les en-têtes SPDX.
#   qt6sermo: troisième port, hors GTK. Il se construit avec CMake et non
#             autotools, et il est versionné indépendamment (1.0.0 quand les
#             ports GTK sont en 1.1.3) : il a donc ses propres travaux, plus bas.
#   exemples: lance RÉELLEMENT les exemples livrés, sous Xvfb, en fr_FR.UTF-8,
#             puis les gardes MAXWIDGETS, --do et HAPLO_ALLOWED_CMDS.
#
# Le second étage existe parce que le premier ne suffit pas : le 2026-08-22 les
# deux ports plantaient à l'ouverture d'une <list> et sur tout nombre à virgule
# en locale française, pendant que le pipeline restait vert — il n'ouvrait aucune
# fenêtre et tournait en locale C.

name: sermo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.port }} — compilation, XML, comportement, durcissement
    runs-on: ubuntu-latest
    container: debian:testing
    strategy:
      fail-fast: false
      matrix:
        include:
          - port: gtk3sermo
            deps: "libgtk-3-dev libvte-2.91-dev libgtk-layer-shell-dev check"
            extra_configure: "--enable-unit-tests"
          - port: gtk4sermo
            deps: "libgtk-4-dev libvte-2.91-gtk4-dev"
            extra_configure: ""
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential flex bison pkg-config ca-certificates \
            automake autoconf libtool binutils texinfo ${{ matrix.deps }}

      # extra_configure porte --enable-unit-tests là où l'option existe
      # (gtk3sermo). Elle était documentée mais jamais rejouée : c'est pour ça
      # que `make check` est resté cassé quatre mois sans que personne le voie.
      - name: Compiler, tester unitairement, installer
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.1.4
        run: |
          autoreconf -fi
          ./configure --prefix="$GITHUB_WORKSPACE/inst" ${{ matrix.extra_configure }}
          make -j"$(nproc)"
          make check
          make install
          test -x "$GITHUB_WORKSPACE/inst/bin/${{ matrix.port }}"

      - name: Suite XML de régression
        run: PATH="$GITHUB_WORKSPACE/inst/bin:$PATH" sh tests/xml/run_tests.sh "${{ matrix.port }}"

      - name: Tests de comportement (cœur)
        run: sh tests/run_unit_tests.sh "${{ matrix.port }}"

      # Mesure sur le BINAIRE PRODUIT, pas sur les drapeaux annoncés : un flag posé
      # dans un Makefile ne prouve rien s'il ne survit pas à l'édition de liens.
      - name: Durcissement (readelf sur le binaire)
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.1.4
        run: bash "$GITHUB_WORKSPACE/tests/garde_durcissement.sh" "src/${{ matrix.port }}"

      # Statique, parce que la faute qu'il empêche est une course qui ne se
      # déclenche qu'une fois sur dix : un test comportemental serait vert la
      # plupart du temps, donc ne prouverait rien.
      - name: Garde — thread de la barre de progression
        run: sh tests/garde_progressbar_thread.sh "${{ matrix.port }}/${{ matrix.port }}_1.1.4/src/widget_progressbar.c"

      - name: Garde — en-têtes SPDX
        run: bash tests/garde_spdx.sh "${{ matrix.port }}/${{ matrix.port }}_1.1.4/src"

      - name: Garde — aucune fonction interdite
        run: bash tests/garde_fonctions_interdites.sh "${{ matrix.port }}/${{ matrix.port }}_1.1.4/src"

      # Barrière à l'entrée : aucun en-tête « · poste <machine> » venu du dépôt
      # privé ne doit entrer ici. Une fuite de ce genre a coûté la recréation
      # complète du projet GitLab en août 2026.
      - name: Garde — pas de nom de machine
        run: bash tests/garde_pas_de_poste.sh "$GITHUB_WORKSPACE"

  exemples:
    name: ${{ matrix.port }} — exemples réels (Xvfb, fr_FR.UTF-8)
    runs-on: ubuntu-latest
    container: debian:testing
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - port: gtk3sermo
            deps: "libgtk-3-dev libvte-2.91-dev libgtk-layer-shell-dev"
          - port: gtk4sermo
            deps: "libgtk-4-dev libvte-2.91-gtk4-dev"
    steps:
      - uses: actions/checkout@v4

      # xauth n'est qu'une recommandation de xvfb : sans lui, et avec
      # --no-install-recommends, xvfb-run échoue et TOUS les exemples sont
      # comptés « sans fenêtre ». Le nommer explicitement.
      - name: Dépendances
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential flex bison pkg-config ca-certificates \
            automake autoconf libtool texinfo ${{ matrix.deps }} \
            xvfb xauth xdotool locales dbus-x11 fonts-dejavu-core adwaita-icon-theme

      - name: Locale française
        run: |
          sed -i 's/^# *fr_FR.UTF-8/fr_FR.UTF-8/' /etc/locale.gen
          locale-gen

      - name: Compiler
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.1.4
        run: |
          autoreconf -fi
          ./configure
          make -j"$(nproc)"

      - name: Lancer les exemples livrés
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.1.4
        env:
          LC_ALL: fr_FR.UTF-8
          LANG: fr_FR.UTF-8
        run: bash tests/run_examples.sh "src/${{ matrix.port }}"

      - name: Garde — MAXWIDGETS
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.1.4
        run: bash "$GITHUB_WORKSPACE/tests/garde_maxwidgets.sh" "src/${{ matrix.port }}"

      - name: Garde — option --do
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.1.4
        run: bash "$GITHUB_WORKSPACE/tests/garde_option_do.sh" "src/${{ matrix.port }}"

      - name: Garde — HAPLO_ALLOWED_CMDS
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.1.4
        run: bash "$GITHUB_WORKSPACE/tests/garde_allowed_cmds.sh" "src/${{ matrix.port }}"

      # La ligne rendue au shell doit rester des données : le banc ouvre une
      # vraie fenêtre, clique, et passe la ligne produite à eval sous
      # surveillance d'un fichier témoin.
      - name: Garde — échappement de la sortie
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.1.4
        run: bash "$GITHUB_WORKSPACE/tests/garde_echappement_sortie.sh" "src/${{ matrix.port }}"

      # run_examples.sh ouvre les fenêtres mais ne clique jamais. Ouvrir ne
      # suffit pas : un <switch> cliqué tuait les deux ports par SIGSEGV.
      - name: Garde — les widgets survivent au clic
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.1.4
        run: bash "$GITHUB_WORKSPACE/tests/garde_clic_widgets.sh" "src/${{ matrix.port }}"

      # tests/xml lance --print-ir : il PARSE le XML sans construire un seul
      # widget. Le 2026-08-29, cinq fonctions du port GTK 4 se sont revelees
      # mortes alors que les 55 cas XML etaient verts depuis des mois.
      - name: Comportement — les valeurs rendues, pas seulement le XML
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.1.4
        run: sh "$GITHUB_WORKSPACE/tests/comportement/run.sh" "$PWD/src/${{ matrix.port }}"

      # border-width ne produit AUCUNE variable : il change une TAILLE.
      - name: Comportement — border-width change bien la geometrie
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.1.4
        run: sh "$GITHUB_WORKSPACE/tests/comportement/geometrie.sh" "$PWD/src/${{ matrix.port }}"

  # ─────────────────── troisième port : Qt 6 (CMake) ───────────────────
  # Hors de la matrice ci-dessus, qui code en dur autotools et la version 1.1.3.
  # Branché à l'intégration continue de référence le 2026-09-02, une fois vert
  # sur les deux suites : 55/55 cas XML et 24/24 au banc de comportement.
  # Il n'a PAS d'ancrage Wayland (layer-shell) : celui-ci n'existe que sur le
  # port GTK 3 de référence.
  qt6sermo:
    name: qt6sermo — compilation (CMake), XML, comportement
    runs-on: ubuntu-latest
    container: debian:testing
    steps:
      - uses: actions/checkout@v4

      # libglib2.0-dev n'est PAS une dépendance du port : il lie Qt, pas GLib.
      # Elle sert à tests/run_unit_tests.sh, qui compile safe_exec.c à part,
      # contre la VRAIE glib et non le shim — même test pour les trois ports.
      - name: Dépendances
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential flex bison pkg-config ca-certificates \
            cmake qt6-base-dev libglib2.0-dev

      - name: Compiler et installer
        working-directory: qt6sermo/qt6sermo_1.0.1
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/inst"
          cmake --build build -j"$(nproc)"
          cmake --install build
          test -x "$GITHUB_WORKSPACE/inst/bin/qt6sermo"

      - name: Suite XML de régression
        run: PATH="$GITHUB_WORKSPACE/inst/bin:$PATH" sh tests/xml/run_tests.sh qt6sermo

      - name: Tests de comportement (cœur)
        run: sh tests/run_unit_tests.sh qt6sermo

  # Le port Qt 6 ne peut pas rejoindre le travail « exemples » : celui-ci appelle
  # autoreconf. Son banc de comportement lui est propre et vit dans son arbre :
  # 24 cas rejoués sous Xvfb, chacun comparé à la valeur que rend le port GTK 3.
  comportement-qt6sermo:
    name: qt6sermo — banc de comportement (Xvfb)
    runs-on: ubuntu-latest
    container: debian:testing
    needs: qt6sermo
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential flex bison pkg-config ca-certificates \
            cmake qt6-base-dev xvfb xauth locales dbus-x11 fonts-dejavu-core

      - name: Compiler
        working-directory: qt6sermo/qt6sermo_1.0.1
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Comportement — les valeurs rendues, pas seulement le XML
        working-directory: qt6sermo/qt6sermo_1.0.1
        run: QT6_BIN="$PWD/build/qt6sermo" sh tests/comportement/run.sh
