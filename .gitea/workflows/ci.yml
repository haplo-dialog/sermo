# Intégration continue — miroirs GitHub / Gitea
#
# ⚠️ La CI de RÉFÉRENCE est `.gitlab-ci.yml`, à la racine : c'est elle qui tourne
# à chaque poussée sur gitlab.com/haplo-dialog/sermo, et c'est elle qui fait foi.
# Ce fichier n'en est qu'une transposition, fournie pour les miroirs et les
# duplications (forks) hébergés ailleurs. Il n'est exécuté par aucun automate du
# projet : personne ici ne l'a jamais vu tourner. Si les deux divergent, croire
# `.gitlab-ci.yml`.
#
# Il couvre le même terrain :
#   build   : compile CHAQUE port, puis le valide contre la suite XML
#             (--print-ir : analyse seule, sans serveur X), les tests de
#             comportement, la mesure de durcissement sur le binaire produit,
#             le garde-fou du thread de la barre de progression, et les en-têtes SPDX.
#   exemples: lance RÉELLEMENT les exemples livrés, sous Xvfb, en fr_FR.UTF-8,
#             puis les gardes MAXWIDGETS, --do et HAPLO_ALLOWED_CMDS.
#
# Le second étage existe parce que le premier ne suffit pas : le 2026-08-22 les
# deux ports plantaient à l'ouverture d'une <list> et sur tout nombre à virgule
# en locale française, pendant que le pipeline restait vert — il n'ouvrait aucune
# fenêtre et tournait en locale C.

name: sermo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.port }} — compilation, XML, comportement, durcissement
    runs-on: ubuntu-latest
    container: debian:testing
    strategy:
      fail-fast: false
      matrix:
        include:
          - port: gtk3sermo
            deps: "libgtk-3-dev libvte-2.91-dev libgtk-layer-shell-dev"
          - port: gtk4sermo
            deps: "libgtk-4-dev libvte-2.91-gtk4-dev"
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential flex bison pkg-config ca-certificates \
            automake autoconf libtool binutils ${{ matrix.deps }}

      - name: Compiler et installer
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.0.0
        run: |
          autoreconf -fi
          ./configure --prefix="$GITHUB_WORKSPACE/inst"
          make -j"$(nproc)"
          make install
          test -x "$GITHUB_WORKSPACE/inst/bin/${{ matrix.port }}"

      - name: Suite XML de régression
        run: PATH="$GITHUB_WORKSPACE/inst/bin:$PATH" sh tests/xml/run_tests.sh "${{ matrix.port }}"

      - name: Tests de comportement (cœur)
        run: sh tests/run_unit_tests.sh "${{ matrix.port }}"

      # Mesure sur le BINAIRE PRODUIT, pas sur les drapeaux annoncés : un flag posé
      # dans un Makefile ne prouve rien s'il ne survit pas à l'édition de liens.
      - name: Durcissement (readelf sur le binaire)
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.0.0
        run: bash "$GITHUB_WORKSPACE/tests/garde_durcissement.sh" "src/${{ matrix.port }}"

      # Statique, parce que la faute qu'il empêche est une course qui ne se
      # déclenche qu'une fois sur dix : un test comportemental serait vert la
      # plupart du temps, donc ne prouverait rien.
      - name: Garde — thread de la barre de progression
        run: sh tests/garde_progressbar_thread.sh "${{ matrix.port }}/${{ matrix.port }}_1.0.0/src/widget_progressbar.c"

      - name: Garde — en-têtes SPDX
        run: bash tests/garde_spdx.sh "${{ matrix.port }}/${{ matrix.port }}_1.0.0/src"

      - name: Garde — aucune fonction interdite
        run: bash tests/garde_fonctions_interdites.sh "${{ matrix.port }}/${{ matrix.port }}_1.0.0/src"

  exemples:
    name: ${{ matrix.port }} — exemples réels (Xvfb, fr_FR.UTF-8)
    runs-on: ubuntu-latest
    container: debian:testing
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - port: gtk3sermo
            deps: "libgtk-3-dev libvte-2.91-dev libgtk-layer-shell-dev"
          - port: gtk4sermo
            deps: "libgtk-4-dev libvte-2.91-gtk4-dev"
    steps:
      - uses: actions/checkout@v4

      # xauth n'est qu'une recommandation de xvfb : sans lui, et avec
      # --no-install-recommends, xvfb-run échoue et TOUS les exemples sont
      # comptés « sans fenêtre ». Le nommer explicitement.
      - name: Dépendances
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential flex bison pkg-config ca-certificates \
            automake autoconf libtool ${{ matrix.deps }} \
            xvfb xauth xdotool locales dbus-x11 fonts-dejavu-core

      - name: Locale française
        run: |
          sed -i 's/^# *fr_FR.UTF-8/fr_FR.UTF-8/' /etc/locale.gen
          locale-gen

      - name: Compiler
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.0.0
        run: |
          autoreconf -fi
          ./configure
          make -j"$(nproc)"

      - name: Lancer les exemples livrés
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.0.0
        env:
          LC_ALL: fr_FR.UTF-8
          LANG: fr_FR.UTF-8
        run: bash tests/run_examples.sh "src/${{ matrix.port }}"

      - name: Garde — MAXWIDGETS
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.0.0
        run: bash "$GITHUB_WORKSPACE/tests/garde_maxwidgets.sh" "src/${{ matrix.port }}"

      - name: Garde — option --do
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.0.0
        run: bash "$GITHUB_WORKSPACE/tests/garde_option_do.sh" "src/${{ matrix.port }}"

      - name: Garde — HAPLO_ALLOWED_CMDS
        working-directory: ${{ matrix.port }}/${{ matrix.port }}_1.0.0
        run: bash "$GITHUB_WORKSPACE/tests/garde_allowed_cmds.sh" "src/${{ matrix.port }}"
