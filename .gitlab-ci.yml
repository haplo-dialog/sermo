# .gitlab-ci.yml — Intégration continue haplo-dialog
# Deux étages, et le second existe parce que le premier ne suffit pas.
#
#   build-test : compile chaque port, puis le valide contre la suite de régression
#                XML (tests/xml/run_tests.sh, en mode --print-ir : parse seul, sans
#                serveur X). Rapide, mais ne fait qu'analyser du XML.
#   run-test   : lance RÉELLEMENT les exemples livrés, sous Xvfb et en locale
#                fr_FR.UTF-8.
#
# Pourquoi ce second étage : le 2026-08-22, les deux ports plantaient à l'ouverture
# d'une <list> (segfault) et sur tout nombre à virgule en locale française (abandon).
# Le pipeline était VERT pendant ce temps — parce qu'il n'ouvrait aucune fenêtre et
# tournait en locale C. Un port qui compile et analyse du XML n'est pas un port qui
# marche.
#
# Image debian:testing = cible : Debian testing.
# Un job par port ; ils tournent en parallèle.

stages:
  - build-test
  - run-test

# N'ouvrir qu'un pipeline (pas de doublon branche + merge request).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

default:
  image: debian:testing
  interruptible: true
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      build-essential flex bison pkg-config ca-certificates $DEPS

# ──────────────────────────── modèles ────────────────────────────
.autotools:
  stage: build-test
  script:
    - cd "$PORT/${PORT}_1.1.1"
    - autoreconf -fi
    # $EXTRA_CONFIGURE porte --enable-unit-tests la ou l'option existe (gtk3sermo).
    # Elle etait documentee mais jamais rejouee par la CI : c'est pour ca que
    # make check est reste casse quatre mois sans que personne le voie —
    # test_stringman.c etait ecrit contre des fonctions absentes du binaire.
    - ./configure --prefix="$CI_PROJECT_DIR/inst" $EXTRA_CONFIGURE
    - make -j"$(nproc)"
    - make check
    - make install
    - test -x "$CI_PROJECT_DIR/inst/bin/$PORT"   # le build a bien produit le binaire
    - PATH="$CI_PROJECT_DIR/inst/bin:$PATH" sh "$CI_PROJECT_DIR/tests/xml/run_tests.sh" "$PORT"
    - sh "$CI_PROJECT_DIR/tests/run_unit_tests.sh" "$PORT"   # tests de comportement (cœur)
    # Durcissement : mesure sur le BINAIRE PRODUIT, pas sur les drapeaux
    # annonces. Un flag pose dans un Makefile ne prouve rien s'il ne survit
    # pas a l'edition de liens — c'est ce qui etait arrive a CET.
    - bash "$CI_PROJECT_DIR/tests/garde_durcissement.sh" "src/$PORT"
    # Garde-fou : le thread de la barre de progression ne doit toucher ni GTK
    # ni GDK. Statique, parce que la faute qu'il empêche est une course qui ne
    # se déclenche qu'une fois sur dix — un test comportemental serait vert la
    # plupart du temps, donc ne prouverait rien.
    - sh "$CI_PROJECT_DIR/tests/garde_progressbar_thread.sh" "$CI_PROJECT_DIR/$PORT/${PORT}_1.1.1/src/widget_progressbar.c"
    # LICENCES.md affirme que chaque fichier de src/ porte un SPDX : ce banc
    # rend l'affirmation tenable au lieu de la laisser vieillir.
    - bash "$CI_PROJECT_DIR/tests/garde_spdx.sh" "$CI_PROJECT_DIR/$PORT/${PORT}_1.1.1/src"
    # SECURITY.md et TODO-SECURITY.md affirment qu'aucune fonction interdite
    # (strcpy/strcat/sprintf/system/popen) n'est appelee dans src/. Ce banc rend
    # l'affirmation tenable : il ignore les commentaires — safe_exec.c cite
    # legitimement system() et popen() pour dire qu'il les remplace — et exige une
    # frontiere de mot a GAUCHE, sinon safe_system compterait pour system.
    - bash "$CI_PROJECT_DIR/tests/garde_fonctions_interdites.sh" "$CI_PROJECT_DIR/$PORT/${PORT}_1.1.1/src"
    # Ce depot est alimente par COPIE DE FICHIERS depuis le depot prive, ou une
    # ordonnance impose a chaque .md un en-tete « maj : <date> · poste <machine> ».
    # Une copie sans filtre y ferait entrer 46 fichiers portant le nom de la
    # machine de travail. En aout 2026, une fuite de ce genre a coute la
    # SUPPRESSION et la recreation du projet GitLab : reecrire l'historique
    # n'avait pas suffi, le serveur servait encore les anciens commits par leur
    # empreinte, et la liste publique des pipelines publiait ces empreintes.
    - bash "$CI_PROJECT_DIR/tests/garde_pas_de_poste.sh" "$CI_PROJECT_DIR"

.cmake:
  stage: build-test
  script:
    - cd "$PORT/${PORT}_1.1.1"
    - cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$CI_PROJECT_DIR/inst"
    - cmake --build build -j"$(nproc)"
    - cmake --install build
    - test -x "$CI_PROJECT_DIR/inst/bin/$PORT"
    - PATH="$CI_PROJECT_DIR/inst/bin:$PATH" sh "$CI_PROJECT_DIR/tests/xml/run_tests.sh" "$PORT"
    - sh "$CI_PROJECT_DIR/tests/run_unit_tests.sh" "$PORT"   # tests de comportement (cœur)

# ──────────────────────────── ports (autotools) ────────────────────────────
gtk3sermo:
  extends: .autotools
  variables:
    PORT: gtk3sermo
    EXTRA_CONFIGURE: "--enable-unit-tests"
    DEPS: "automake autoconf libtool libgtk-3-dev libvte-2.91-dev libgtk-layer-shell-dev check texinfo"

gtk4sermo:
  extends: .autotools
  variables:
    PORT: gtk4sermo
    # gtk4sermo n'a pas d'--enable-unit-tests : pas de tests C de son cote.
    EXTRA_CONFIGURE: ""
    DEPS: "automake autoconf libtool libgtk-4-dev libvte-2.91-gtk4-dev texinfo"

# ─────────────────── exécution réelle des exemples ───────────────────
# Ouvre vraiment les fenêtres, en français. Le banc sort en erreur dès qu'un
# exemple plante, refuse de s'analyser, ou n'affiche aucune fenêtre.
.examples:
  stage: run-test
  variables:
    DEPS: "$TOOLKIT_DEPS xvfb xauth xdotool locales dbus-x11 fonts-dejavu-core"
  script:
    - sed -i 's/^# *fr_FR.UTF-8/fr_FR.UTF-8/' /etc/locale.gen
    - locale-gen
    - cd "$PORT/${PORT}_1.1.1"
    - autoreconf -fi
    - ./configure
    - make -j"$(nproc)"
    - LC_ALL=fr_FR.UTF-8 LANG=fr_FR.UTF-8 bash tests/run_examples.sh "src/$PORT"
    # Garde-fou de _sum() : au-dela de MAXWIDGETS enfants directs, le refus doit
    # etre net et nomme, pas une ecriture silencieuse hors des tableaux fixes.
    - bash "$CI_PROJECT_DIR/tests/garde_maxwidgets.sh" "src/$PORT"
    # --do : annoncee par les pages de manuel installees depuis toujours, et
    # absente du binaire jusqu'au 2026-08-24. Le test verifie qu'elle est
    # annoncee, qu'elle tourne, que sa sortie est ordonnee, et qu'elle reste
    # soumise au refus fail-closed du modele de securite.
    - bash "$CI_PROJECT_DIR/tests/garde_option_do.sh" "src/$PORT"
    # HAPLO_ALLOWED_CMDS : eteinte par defaut, mordante une fois posee, et
    # increvable par sh -c ou par un chemin absolu.
    - bash "$CI_PROJECT_DIR/tests/garde_allowed_cmds.sh" "src/$PORT"
    # La ligne rendue au shell doit rester des DONNEES. Toute la documentation
    # invite a passer NOM="valeur" a eval, or la valeur peut etre TAPEE par la
    # personne qui se sert du dialogue. Entre guillemets doubles le shell
    # developpe QUATRE caracteres, pas deux : \  "  $  et l'accent grave.
    # Ce banc ouvre une vraie fenetre, clique, et passe la ligne produite a eval
    # sous surveillance d'un fichier temoin.
    - bash "$CI_PROJECT_DIR/tests/garde_echappement_sortie.sh" "src/$PORT"
    # Les widgets interactifs doivent survivre a un CLIC. run_examples.sh ouvre
    # les fenetres mais ne clique jamais : le 2026-08-25, cliquer un <switch>
    # tuait les deux ports par SIGSEGV pendant que les 55 et 58 exemples etaient
    # comptes OK et que le pipeline restait vert. Ouvrir ne suffit pas.
    - bash "$CI_PROJECT_DIR/tests/garde_clic_widgets.sh" "src/$PORT"

exemples:gtk3sermo:
  extends: .examples
  needs: ["gtk3sermo"]
  variables:
    PORT: gtk3sermo
    TOOLKIT_DEPS: "automake autoconf libtool libgtk-3-dev libvte-2.91-dev libgtk-layer-shell-dev texinfo"

exemples:gtk4sermo:
  extends: .examples
  needs: ["gtk4sermo"]
  variables:
    PORT: gtk4sermo
    TOOLKIT_DEPS: "automake autoconf libtool libgtk-4-dev libvte-2.91-gtk4-dev texinfo"
